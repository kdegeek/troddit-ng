<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#287453" />
    <title>Troddit is offline</title>
    <style>
      body { margin: 0; color: #26352f; background: #f6f7f4; font: 16px system-ui, sans-serif; line-height: 1.7; }
      main { max-width: 32rem; margin: 15vh auto; padding: 2rem; }
      h1 { font-size: 2.5rem; letter-spacing: -.04em; line-height: 1.1; }
      button { margin-top: 1rem; padding: .8rem 1.25rem; color: white; background: #287453; border: 0; border-radius: .6rem; cursor: pointer; font: inherit; }
      button:focus-visible { outline: 3px solid #287453; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { body { color: #dce6dd; background: #141b18; } }
    </style>
  </head>
  <body>
    <main>
      <p>troddit. · YOUR SPACE. YOUR PACE.</p>
      <h1>You’re offline</h1>
      <p>Troddit needs a connection to load this page. Any saved comment drafts remain on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
